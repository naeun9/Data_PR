<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터패턴인식 실전 모의고사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --correct: #43e97b;
    --wrong: #ff4d6d;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,101,132,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* 헤더 */
  header {
    text-align: center;
    margin-bottom: 44px;
    animation: fadeDown 0.7s ease;
  }

  .subject-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(108,99,255,0.12);
    border: 1px solid rgba(108,99,255,0.3);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
  }

  /* 회차 선택 탭 */
  .round-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    flex-wrap: wrap;
  }

  .round-tab {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    white-space: nowrap;
  }

  .round-tab:hover {
    color: var(--text);
    background: rgba(108,99,255,0.1);
  }

  .round-tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .round-tab.done {
    border: 1px solid rgba(67,233,123,0.3);
  }

  .round-tab .tab-score {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    margin-top: 2px;
    opacity: 0.8;
  }

  /* 진행 상황 */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .progress-bar-bg {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  .progress-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .score-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent3);
    white-space: nowrap;
  }

  /* 문제 카드 */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
    animation: fadeUp 0.4s ease both;
  }

  .question-card:hover { border-color: rgba(108,99,255,0.3); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(108,99,255,0.15);
    border: 1px solid rgba(108,99,255,0.25);
    padding: 4px 9px;
    border-radius: 6px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--text);
  }

  .code-block {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 12px 0;
    color: #a8d8a8;
    line-height: 1.6;
    white-space: pre;
    overflow-x: auto;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--surface);
    user-select: none;
  }

  .option:hover:not(.disabled) {
    border-color: rgba(108,99,255,0.5);
    background: rgba(108,99,255,0.08);
    transform: translateX(4px);
  }

  .option-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--border);
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }

  .option.selected { border-color: var(--accent); background: rgba(108,99,255,0.12); }
  .option.selected .option-num { background: var(--accent); color: white; }
  .option.correct { border-color: var(--correct); background: rgba(67,233,123,0.1); }
  .option.correct .option-num { background: var(--correct); color: #0a0a0f; }
  .option.wrong { border-color: var(--wrong); background: rgba(255,77,109,0.1); }
  .option.wrong .option-num { background: var(--wrong); color: white; }
  .option.disabled { cursor: default; }
  .option.highlight-correct { border-color: var(--correct); background: rgba(67,233,123,0.08); }

  .feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
    animation: fadeUp 0.3s ease;
  }

  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(67,233,123,0.1); border: 1px solid rgba(67,233,123,0.3); color: var(--correct); }
  .feedback.wrong-fb { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3); color: #ff8fa3; }

  /* 결과 화면 */
  #result-screen {
    display: none;
    text-align: center;
    padding: 56px 36px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    animation: fadeUp 0.6s ease;
  }

  .result-emoji { font-size: 60px; margin-bottom: 16px; display: block; }

  .result-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(48px, 8vw, 72px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .result-label { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .result-grade { font-size: 20px; font-weight: 700; margin-bottom: 28px; color: var(--text); }

  .result-breakdown {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .breakdown-item { text-align: center; }
  .breakdown-val { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; }
  .breakdown-val.c { color: var(--correct); }
  .breakdown-val.w { color: var(--wrong); }
  .breakdown-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* 전체 성적표 */
  .total-scoreboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
    text-align: left;
  }

  .scoreboard-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .scoreboard-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .scoreboard-row:last-child { border-bottom: none; }

  .scoreboard-round { color: var(--text-muted); }
  .scoreboard-pts {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }

  .scoreboard-bar-wrap {
    flex: 1;
    margin: 0 16px;
    height: 4px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }

  .scoreboard-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.8s ease;
  }

  .btn-wrap { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn-retry, .btn-all {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 13px 32px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-retry {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,99,255,0.4); }

  .btn-all {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-all:hover { border-color: var(--accent); color: var(--accent); }

  /* 제출 버튼 */
  .submit-wrap { text-align: center; margin-top: 36px; }

  .btn-submit {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 15px 52px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 100px;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(108,99,255,0.45); }
  .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  /* 애니메이션 */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .question-card { padding: 20px 16px; }
    .round-tabs { gap: 4px; }
    .round-tab { font-size: 12px; padding: 8px 6px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="subject-tag">Sookmyung W. Univ. · AI Engineering</div>
    <h1>데이터패턴인식<br>실전 모의고사</h1>
    <p class="subtitle">7회차 · 총 140문제 · 각 1점</p>
  </header>

  <!-- 회차 탭 -->
  <div class="round-tabs">
    <button class="round-tab active" onclick="switchRound(0)" id="tab-0">
      1회차
      <span class="tab-score" id="tab-score-0">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(1)" id="tab-1">
      2회차
      <span class="tab-score" id="tab-score-1">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(2)" id="tab-2">
      3회차
      <span class="tab-score" id="tab-score-2">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(3)" id="tab-3">
      4회차
      <span class="tab-score" id="tab-score-3">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(4)" id="tab-4">
      5회차 ★
      <span class="tab-score" id="tab-score-4">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(5)" id="tab-5">
      6회차 ★
      <span class="tab-score" id="tab-score-5">-/20</span>
    </button>
    <button class="round-tab" onclick="switchRound(6)" id="tab-6">
      7회차 🔥
      <span class="tab-score" id="tab-score-6">-/20</span>
    </button>
  </div>

  <!-- 진행 바 -->
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="progress-text" id="progressText">0 / 20</span>
    <span class="score-badge" id="scoreBadge">점수: 0점</span>
  </div>

  <div id="quiz-wrap"></div>

  <div class="submit-wrap">
    <button class="btn-submit" id="submitBtn" disabled onclick="showResult()">채점하기</button>
  </div>

  <div id="result-screen">
    <span class="result-emoji" id="resultEmoji"></span>
    <div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-breakdown">
      <div class="breakdown-item">
        <div class="breakdown-val c" id="correctCount"></div>
        <div class="breakdown-label">✓ 정답</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-val w" id="wrongCount"></div>
        <div class="breakdown-label">✗ 오답</div>
      </div>
    </div>
    <div class="total-scoreboard" id="totalScoreboard" style="display:none;">
      <div class="scoreboard-title">전체 성적표</div>
      <div id="scoreboardRows"></div>
    </div>
    <div class="btn-wrap">
      <button class="btn-retry" id="retryBtn" onclick="retryRound()">이 회차 다시 풀기</button>
      <button class="btn-all" onclick="showAllScores()">전체 성적 보기</button>
    </div>
  </div>

</div>

<script>
const allQuestions = [
  // ===== 1회차 =====
  [
    {
      q: "경사 하강법에서 학습률(Learning Rate)이 너무 클 때 나타나는 현상은?",
      options: ["최적점 근처에서 발산할 수 있다","가중치가 모두 0으로 수렴한다","학습이 매우 느려진다","과적합이 발생한다"],
      answer: 0,
      explain: "학습률이 너무 크면 최솟값을 지나쳐 오차가 발산할 수 있다. 느려지는 것은 학습률이 작을 때의 현상이다."
    },
    {
      q: "f(x, y) = 4x³y + 2x²y³ + 3y⁵ + 2x 를 x에 관해 편미분한 결과는?",
      options: ["12x²y + 4xy³ + 2","4x³ + 6x²y² + 15y⁴","12x²y + 4xy³ + 15y⁴ + 2","12x²y + 2x²y³ + 2"],
      answer: 0,
      explain: "y를 상수로 취급한다. 4x³y→12x²y, 2x²y³→4xy³, 3y⁵→0(x 없음), 2x→2. 따라서 12x²y + 4xy³ + 2이다."
    },
    {
      q: "단층 퍼셉트론이 XOR 문제를 해결할 수 없는 이유는?",
      options: ["역전파 알고리즘이 없기 때문이다","하나의 직선으로 선형 분리가 불가능하기 때문이다","가중치 수가 부족하기 때문이다","sigmoid 함수를 사용하기 때문이다"],
      answer: 1,
      explain: "XOR은 직선 하나로 0과 1을 분리할 수 없는 비선형 문제다. 단층 퍼셉트론의 본질은 '직선 긋기'이므로 해결 불가능하다."
    },
    {
      q: "LSTM에서 Cell state(C_t)를 갱신하는 수식으로 옳은 것은?",
      options: ["C_t = o_t ⊙ tanh(C_{t-1})","C_t = f_t ⊙ C_{t-1} + i_t ⊙ C̃_t","C_t = i_t ⊙ C_{t-1} + f_t ⊙ h_t","C_t = f_t ⊙ h_{t-1} + i_t ⊙ x_t"],
      answer: 1,
      explain: "C_t = f_t⊙C_{t-1} + i_t⊙C̃_t. f_t⊙C_{t-1}은 과거 유지, i_t⊙C̃_t는 현재 반영을 의미한다."
    },
    {
      q: "RNN에서 Vanishing Gradient가 발생하는 근본 원인은?",
      options: ["W_hh가 매 시점마다 새로 초기화되기 때문이다","softmax를 출력층에 사용하기 때문이다","tanh 미분값이 0~1 사이라 누적 곱하면 0에 수렴하기 때문이다","시퀀스가 길어질수록 순전파 속도가 느려지기 때문이다"],
      answer: 2,
      explain: "tanh의 미분은 0~1 사이이므로 chain rule로 계속 곱하면 0에 수렴한다. 이것이 기울기 소실의 근본 원인이다."
    },
    {
      q: "LSTM의 forget gate, input gate, output gate에 공통으로 적용되는 활성화 함수는?",
      options: ["tanh","ReLU","sigmoid","softmax"],
      answer: 2,
      explain: "세 게이트 모두 sigmoid를 사용하여 0~1 사이 값을 출력한다. tanh는 후보 cell state(C̃_t)에 사용된다."
    },
    {
      q: "GRU의 update gate(z_t)가 1에 가까울 때의 동작은?",
      options: ["과거 정보 h_{t-1}을 삭제한다","현재 입력 정보를 더 많이 반영한다","reset gate의 영향을 강화한다","후보 hidden state를 무시한다"],
      answer: 1,
      explain: "h_t = (1-z_t)⊙h_{t-1} + z_t⊙h̃_t에서 z_t=1이면 z_t⊙h̃_t 항이 커져 현재 정보를 더 많이 반영한다."
    },
    {
      q: "LSTM과 GRU의 차이점으로 옳은 것은?",
      options: ["GRU는 LSTM보다 게이트 수가 많다","LSTM은 Hidden state만 관리한다","LSTM과 GRU의 파라미터 수는 동일하다","GRU는 Cell state가 없고 forget·input gate를 하나로 합쳤다"],
      answer: 3,
      explain: "GRU: Hidden state(h_t) 하나만 관리, 게이트 2개. LSTM의 forget gate + input gate를 update gate 하나로 통합했다."
    },
    {
      q: "feature map이 8×8×64일 때 Flatten 후 FC 계층에 입력되는 벡터의 길이는?",
      options: ["512","2048","4096","8192"],
      answer: 2,
      explain: "Flatten은 3차원 텐서를 1차원으로 변환한다. 8 × 8 × 64 = 4096이다."
    },

  new Array(20).fill(false),

let roundScores = [-1, -1, -1, -1, -1, -1, -1];
let currentScore = 0;

function switchRound(r) {
  currentRound = r;
  currentScore = roundScores[r] >= 0 ? roundScores[r] : 0;

  // 탭 활성화
  for (let i = 0; i < 7; i++) {
    document.getElementById(`tab-${i}`).classList.toggle('active', i === r);
  }

  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  document.querySelector('.submit-wrap').style.display = 'block';

  buildQuiz();
  updateProgress();
}

function buildQuiz() {
  const wrap = document.getElementById('quiz-wrap');
  wrap.innerHTML = '';
  const qs = allQuestions[currentRound];

  qs.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    let qText = q.q;
    let codeHtml = '';
    if (qText.includes('\n')) {
      const parts = qText.split('\n');
      qText = parts[0];
      codeHtml = `<div class="code-block">${parts.slice(1).join('\n')}</div>`;
    }

    const isDone = roundAnswered[currentRound][qi];
    const chosenAnswer = isDone ? roundAnswered[currentRound][qi] : null;

    const optionsHtml = q.options.map((opt, oi) => {
      let cls = 'option';
      if (isDone && isDone !== true) {
        cls += ' disabled';
        if (oi === q.answer) cls += ' correct';
        else if (oi === roundAnswered[currentRound][qi] && oi !== q.answer) cls += ' wrong';
      } else if (isDone === true) {
        cls += ' disabled';
      }
      return `<div class="${cls}" id="opt-${qi}-${oi}" onclick="selectOption(${qi},${oi})">
        <div class="option-num">${oi + 1}</div>
        <div class="option-text">${opt}</div>
      </div>`;
    }).join('');

    let fbHtml = '';
    if (isDone && isDone !== true) {
      const isCorrect = roundAnswered[currentRound][qi] === q.answer;
      fbHtml = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
        <span>${isCorrect ? '✓ 정답입니다!' : `✗ 오답입니다. 정답은 ${q.answer + 1}번.`}</span> ${q.explain}
      </div>`;
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">Q${String(qi+1).padStart(2,'0')}</div>
        <div class="q-text">${qText}</div>
      </div>
      ${codeHtml}
      <div class="options">${optionsHtml}</div>
      ${fbHtml}
    `;

    wrap.appendChild(card);
  });

  const allDone = roundAnswered[currentRound].every(v => v !== false);
  document.getElementById('submitBtn').disabled = !allDone;
}

function selectOption(qi, oi) {
  if (roundAnswered[currentRound][qi] !== false) return;

  const q = allQuestions[currentRound][qi];
  roundAnswered[currentRound][qi] = oi;

  const isCorrect = oi === q.answer;
  if (isCorrect) currentScore++;

  // 시각적 업데이트
  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${qi}-${i}`);
    el.classList.add('disabled');
    if (i === q.answer) el.classList.add('correct');
    if (i === oi && !isCorrect) el.classList.add('wrong');
  });

  const card = document.getElementById(`opt-${qi}-0`).closest('.question-card');
  const fb = document.createElement('div');
  fb.className = `feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = `<span>${isCorrect ? '✓ 정답입니다!' : `✗ 오답입니다. 정답은 ${q.answer+1}번.`}</span> ${q.explain}`;
  card.appendChild(fb);

  updateProgress();

  const allDone = roundAnswered[currentRound].every(v => v !== false);
  document.getElementById('submitBtn').disabled = !allDone;
}

function updateProgress() {
  const cnt = roundAnswered[currentRound].filter(v => v !== false).length;
  const pct = (cnt / 20) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${cnt} / 20`;
  document.getElementById('scoreBadge').textContent = `점수: ${currentScore}점`;
}

function showResult() {
  roundScores[currentRound] = currentScore;
  document.getElementById(`tab-score-${currentRound}`).textContent = `${currentScore}/20`;

  document.getElementById('quiz-wrap').style.display = 'none';
  document.querySelector('.submit-wrap').style.display = 'none';

  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const pct = (currentScore / 20) * 100;
  document.getElementById('resultScore').textContent = currentScore;
  document.getElementById('resultLabel').textContent = `/ 20점 (${currentRound+1}회차)`;
  document.getElementById('correctCount').textContent = currentScore;
  document.getElementById('wrongCount').textContent = 20 - currentScore;

  let emoji, grade;
  if (pct >= 90) { emoji = '🏆'; grade = '완벽해! A+'; }
  else if (pct >= 80) { emoji = '🎯'; grade = '훌륭해! A'; }
  else if (pct >= 70) { emoji = '👍'; grade = '잘했어! B+'; }
  else if (pct >= 60) { emoji = '📚'; grade = '조금 더 공부하자. B'; }
  else { emoji = '💪'; grade = '다시 도전해보자!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultGrade').textContent = grade;
  document.getElementById('totalScoreboard').style.display = 'none';
}

function showAllScores() {
  const sb = document.getElementById('totalScoreboard');
  sb.style.display = 'block';
  const rows = document.getElementById('scoreboardRows');
  rows.innerHTML = '';

  const names = ['1회차','2회차','3회차','4회차','5회차 ★','6회차 ★','7회차 🔥'];
  let total = 0, counted = 0;

  names.forEach((name, i) => {
    const s = roundScores[i];
    const pct = s >= 0 ? (s / 20) * 100 : 0;
    if (s >= 0) { total += s; counted++; }

    const row = document.createElement('div');
    row.className = 'scoreboard-row';
    row.innerHTML = `
      <span class="scoreboard-round">${name}</span>
      <div class="scoreboard-bar-wrap">
        <div class="scoreboard-bar" style="width:${pct}%"></div>
      </div>
      <span class="scoreboard-pts" style="color:${s>=0?'var(--accent3)':'var(--text-muted)'}">${s >= 0 ? s+'/20' : '-'}</span>
    `;
    rows.appendChild(row);
  });

  if (counted > 0) {
    const totalRow = document.createElement('div');
    totalRow.className = 'scoreboard-row';
    totalRow.style.marginTop = '8px';
    totalRow.innerHTML = `
      <span class="scoreboard-round" style="color:var(--text);font-weight:700;">총점 (${counted}회차)</span>
      <div class="scoreboard-bar-wrap">
        <div class="scoreboard-bar" style="width:${(total/(counted*20))*100}%"></div>
      </div>
      <span class="scoreboard-pts" style="color:var(--accent)">${total}/${counted*20}</span>
    `;
    rows.appendChild(totalRow);
  }
}

function retryRound() {
  roundAnswered[currentRound] = new Array(20).fill(false);
  roundScores[currentRound] = -1;
  currentScore = 0;
  document.getElementById(`tab-score-${currentRound}`).textContent = '-/20';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  document.querySelector('.submit-wrap').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  updateProgress();
  buildQuiz();
}

// 초기 빌드
buildQuiz();
updateProgress();
</script>
</body>
</html>
